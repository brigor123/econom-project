<script>
var N = 25, NOTES = ["מציג: איגור. זמן: דקה. בוקר טוב. אני איגור, וזה איימן. נתחיל בסיפור קטן. שליח של וולט בירושלים מספר שמשלוח משוק מחנה יהודה לרמות היה שווה לו פעם 40 שקל. בינואר 2023 וולט שינתה את שיטת התשלום, ועל אותו משלוח האפליקציה הציעה לו 25. אף אחד לא הסביר לו למה. השאלה שלנו היום: זה סתם עסק שמחפש רווח, או כשל שוק? כדי לענות בחרנו מאמר שפורסם השנה ב-Academic Journal of Finance and Accounting. כתב אותו קאיג'יה ליו מבית הספר למנהל עסקים סטרן באוניברסיטת ניו יורק. הוא טוען שהסיפור של השליח הוא חלק מתמונה גדולה יותר: ארבעה כשלי שוק שמזינים זה את זה.", "מציג: איגור. זמן: חצי דקה. ככה נבנה את ההרצאה. קודם ארבעה מושגים, כדי שנדבר באותה שפה. אחר כך מה המאמר טוען ומה הוא מצא. משם נחזור לישראל, לשליח שלנו ולעוד שני תחומים. איימן יציג את הביקורת שלנו על המאמר. בסוף נשאל אתכם שאלה לדיון, ויהיה קאהוט, אז כדאי להקשיב.", "מציג: איגור. זמן: 3 דקות. במאמר: עמ' 58, פסקה ראשונה של המבוא. נתחיל מהבסיס. הכלכלה הקלאסית אומרת שאם יש מידע מלא, תחרות ושחקנים רציונליים, השוק מגיע לבד לתוצאה יעילה. זו היד הנעלמה. כשאחת ההנחות נשברת, יש כשל שוק. המאמר משתמש בארבעה מושגים. אסימטריה במידע: צד אחד יודע יותר מהשני ומנצל את הפער. השליח שלנו לא יודע איך מחושב התשלום שלו. וולט יודעת. מונופסון: מונופול של קונים. לא מוכר אחד ששולט במחיר, אלא קונה אחד. כאן הקונה הוא הפלטפורמה, ומה שהיא קונה זו העבודה של השליח. מוצר ציבורי: משהו שכולם נהנים ממנו אבל מעטים משלמים עליו, ולכן השוק מייצר ממנו פחות מדי. והשפעה חיצונית: הנזק עובר למי שלא היה חלק מהעסקה. תזכרו את ארבעתם. כל אחד מהם יחזור באחד הכשלים.", "מציג: איגור. זמן: 2 דקות. במאמר: התקציר בעמ' 58 וסוף המבוא בעמ' 59. עכשיו למאמר עצמו. חשוב לדעת מראש שזה מאמר עמדה. אין בו ניסוי, סקר או נתונים חדשים. המחבר אוסף מחקרים קיימים ובונה מהם טענה אחת. הטענה: הכשלים לא עומדים לבד, אחד מזין את השני. המנגנון המשותף הוא אלגוריתם שאף אחד מבחוץ לא רואה איך הוא עובד, ביחד עם עיתונות חלשה ופלטפורמות גדולות שפועלות בכמה שווקים. מי שמשלם: עובדים, צרכנים וקהילות. מי שמרוויח: החברות הגדולות. והמסקנה של המחבר: השוק לא יתקן את זה לבד. צריך שקיפות, רגולציה ומעבר לקפיטליזם של בעלי עניין.", "מציג: איגור. זמן: 2 דקות. במאמר: עמ' 58 למטה ועמ' 59 למעלה. המחבר בונה את הטענה על ארבעה מקרים, וכל אחד נשען על חוקר אחר. אחד, שכר אלגוריתמי בכלכלת הגיג, לפי זפיר טיצ'אאוט ווינה דובאל. שתיים, הימורים ושוק ההון, לפי הרצאה של מייקל לואיס, הכותב של \"הביג שורט\". שלוש, קריסת העיתונות, לפי ויקטור פיקארד. ארבע, מידע כוזב ברשתות, לפי פול בארט. המכנה המשותף: מי שמחזיק במידע ובאלגוריתם מעביר את העלות למי שלא מחזיק. שימו לב לכשל הרביעי, נחזור אליו בביקורת. ועכשיו לכשל הראשון, זה של השליח שלנו.", "מציג: איגור. זמן: 2 דקות. במאמר: פרק 2, עמ' 59 ותחילת עמ' 60. איך עובד שכר אלגוריתמי? בארבעה שלבים. מעקב: אובר, דורדאש ואמזון אוספות על כל עובד כמה משימות הוא מקבל, כמה מהר הוא עונה, איפה הוא נמצא ובאילו שעות. הערכה: מזה האלגוריתם מעריך מה השכר הכי נמוך שהעובד עוד יסכים לקבל. כלכלנים קוראים לזה שכר הסתייגות. הצעה: הוא מציע קצת מעל זה. מי שקיבל בעבר הצעות נמוכות, כנראה כי היה במצוקה, יקבל שוב נמוכות. ופיצול: לכל עובד מחיר אחר. טיצ'אאוט מסבירה למה הפיצול חשוב. אם לכל אחד שכר אחר, אין על מה להתאגד. ובעיר בינונית, מי שצריך עבודה גמישה לא מוצא הרבה אלטרנטיבות. אז יש כאן גם אסימטריה במידע וגם מונופסון.", "מציג: איגור. זמן: חצי דקה. במאמר: איור 1, עמ' 60. כך המחבר מציג את זה באיור 1. משמאל שוק רגיל: תעריף של 15 דולר לשעה לכולם. מימין שכר אלגוריתמי: ממוצע של 12.99 דולר, ופיזור רחב בהרבה. כלומר העובדים מקבלים פחות, וכל אחד מקבל משהו אחר. רק שימו לב שהמאמר לא אומר מאיפה המספרים. איימן יחזור לזה בביקורת, ועכשיו הוא ימשיך לכשל השני.", "מציג: איימן. זמן: 2 דקות. במאמר: פרק 3, עמ' 60 עד אמצע עמ' 61. תודה איגור. אותו היגיון בדיוק עובר להימורים ולבורסה. אתרי הימורי ספורט כמו פנדואל מסווגים את המהמרים. מקצוען שמנצח בזכות ידע נחסם, או מקבל תקרת הימור נמוכה. חובב מקבל בונוסים, התראות ועיצוב שדוחף אותו להמר עוד. בקזינו רגיל יתרון הבית ידוע ושווה לכולם. כאן הוא אישי, בדיוק כמו השכר של השליח. לפי לואיס, המדינות בארה\"ב אישרו הימורי ספורט בשביל המסים, כמעט בלי הגנה על הצרכן. בבורסה זה דומה. סוחרים בתדירות גבוהה משקיעים מיליארדים בסיבים אופטיים ובשרתים ליד הבורסה כדי להקדים במיקרו-שניות, ותשלום על זרימת פקודות נותן להם מידע על הפקודות של המשקיע הפרטי. השערת השוק היעיל אומרת שהמחיר משקף את כל המידע. המחבר טוען שכשיש יתרון מידע קבוע, השוק כבר לא מקצה עושר. הוא מעביר אותו מהקטנים לגדולים. עד עכשיו ראינו שני כשלים שבהם מישהו מנצל פער מידע. מי אמור לחשוף דברים כאלה? בדרך כלל עיתונאים. וכאן מגיע הכשל השלישי.", "מציג: איימן. זמן: 2 דקות. במאמר: פרק 4, סוף עמ' 61 ועמ' 62. הכשל הזה שונה. הוא לא על ניצול, אלא על מוצר שהשוק מייצר ממנו פחות מדי. במאה ה-20 עיתונים קיבלו בערך 80% מההכנסות מפרסום ורק 20% ממנויים. פיקארד מסביר שהמפרסמים אף פעם לא קנו עיתונות. הם קנו גישה לקהל. כשגוגל ופייסבוק הציעו קהל זול ומדויק יותר, הכסף עזב. לפי פיקארד, יותר ממחצית המשרות בחדרי החדשות בארה\"ב נעלמו מאז 2008. ומנויים לא סוגרים את הפער, כי הקוראים רגילים לתוכן חינמי. למה? כי עיתונות היא מוצר ציבורי. תחקיר על שחיתות בעירייה עוזר לכל התושבים, אבל רק המנויים משלמים עליו. כל אחד מחכה שמישהו אחר ישלם. זו בעיית הנוסע החופשי.", "מציג: איימן. זמן: חצי דקה. במאמר: איור 3 בעמ' 63, הטקסט בעמ' 62. איור 3 מראה את זה. הקו האדום הוא הכנסות מפרסום, והוא צונח. הקו הירוק הוא מנויים, והוא עולה לאט מדי. עשרות מיליארדי דולרים נעלמו, והתוצאה לפי המאמר: פיטורים, סגירת מדורים ופשיטות רגל. גם כאן אין במאמר מקור לנתונים.", "מציג: איימן. זמן: דקה. במאמר: עמ' 62, שתי הפסקאות האחרונות. ומה קורה לעיר שנשארה בלי עיתון מקומי? המאמר קורא לזה מדבר חדשות, ומונה ארבע תוצאות. פחות אנשים מצביעים. יותר שחיתות, כי אין מי שבודק. העירייה משלמת ריבית גבוהה יותר על אג\"ח, כי השוק מתמחר את חוסר השקיפות. ופחות אנשים מעורבים בקהילה. המאמר אומר שזה תועד במחקרים, אבל לא מביא מספרים ולא שם של מחקר. עכשיו אפשר לחבר את הכשלים.", "מציג: איימן. זמן: 2 דקות. במאמר: פרק 5, איור 4 בעמ' 63 והפסקה הראשונה בעמ' 64. זה הלב של המאמר, איור 4. החץ החשוב ביותר יוצא מהעיתונות. כשהיא חלשה, יש פחות שקיפות, ואף אחד לא חושף מה קורה בשכר של השליחים או בבורסה. אותם אלגוריתמים עובדים בכל התחומים: אובר מתמחרת שכר, פנדואל מדרגת מהמרים, פייסבוק מפיצה תוכן. שם נכנס הכשל הרביעי, מידע כוזב ברשתות. חברה כמו אמזון פועלת בכמה שווקים בבת אחת, אז כלי שעובד בתחום אחד עובר מהר לתחום אחר. וכשל אחד יוצר פגיעות לבא אחריו: לשליח עם שכר נמוך אין כרית ביטחון מול מוצר פיננסי טורף. קיצרנו את התרשים. במאמר יש שמונה חיצים, השארנו חמישה. אז אם השוק לא מתקן את זה, מה כן?", "מציג: איימן. זמן: 2 דקות. במאמר: פרק 6, עמ' 64-65. המחבר מציע פתרון לכל תחום. בשוק העבודה: שהעובד יבין איך מחושב השכר שלו, ביקורת חיצונית על האלגוריתם, והכרה במשא ומתן קיבוצי. בשוק ההון: גילוי מראש של עמלות וסיכונים. בהימורים: תקרת הפקדה, תקופת צינון ואיסור לפנות למהמרים בעייתיים. בעיתונות: הפלטפורמות יחלקו הכנסות מפרסום עם מי שמייצר חדשות. ברשתות: אלגוריתם שמתגמל אמינות ולא רק קליקים. והשורה התחתונה: רגולציה עצמית לא עובדת כשהתחרות דוחפת לנצל, אז המדינה צריכה לקבוע רף. וזה כבר קורה. באיחוד האירופי כל מדינה חייבת עד 2 בדצמבר 2026, שבוע לפני ההצגה שלנו, להחיל דירקטיבה שמחייבת פלטפורמות עבודה להסביר לעובדים איך האלגוריתם מחליט. ובמסצ'וסטס, מיוני 2026, אתר הימורים שמגביל מהמר חייב לנמק לו תוך 48 שעות. לפי הנתונים של החברות עצמן שם, רק 0.64% מהחשבונות מוגבלים, אבל מי שמרוויח יותר מוגבל יותר. בדיוק מה שלואיס טוען. זה בעולם. איגור יראה מה קורה אצלנו.", "מציג: איגור. זמן: 2 דקות. נחזור לשליח מההתחלה. עד ינואר 2023 התשלום בוולט היה פשוט: 18 שקל למשלוח, ועוד שקל לכל 250 מטר אחרי הקילומטר הראשון. אז וולט עברה בירושלים ובחיפה לתשלום לפי \"מאמץ\". לפי שליח שהתראיין ב-ynet, האלגוריתם שוקל קומה, יום, שעה, ופרמטרים שלא סיפרו להם. לטענת השליחים: עד 30% פחות על כל משלוח. זה ה-40 שקל שהפכו ל-25. וולט אמרה שהמטרה היא לדייק את התשלום בערים הרריות. השליחים טענו שהתחילו דווקא שם כי שם הם פחות מאורגנים. זה בדיוק מה שראינו בשקופית 6: קופסה שחורה, מחיר אישי, ואין דרך לבדוק. בקיץ 2025 גם תן ביס העבירה כ-700 שליחים ממעמד של שכירים לעצמאים. ובספטמבר 2026 הוגשה פשרה בתביעה הייצוגית נגד וולט: 34.3 מיליון שקל לשליחים, ותמורה ממוצעת לשעה שלא יורדת משכר מינימום. אבל השליחים נשארים עצמאים, והפשרה עוד צריכה אישור של בית הדין הארצי לעבודה.", "מציג: איגור. זמן: 2 דקות. בהימורים ישראל שונה מארה\"ב. אין אצלנו אתרי הימורי ספורט פרטיים חוקיים. לפי חוק משנת 1967, רק המועצה להסדר ההימורים בספורט, עם ווינר וטוטו, מורשית לקבל הימורי ספורט, והכסף הולך לספורט. אבל יש שוק שחור. לפי מרכז המחקר והמידע של הכנסת, אומדן המשטרה הוא 10 עד 15 מיליארד שקל בשנה. זה אומדן ישן: אותו מספר הוצג כבר ב-2016, ובינואר 2022 המשטרה אמרה לכנסת שאין לה אומדן מהימן ועדכני. לדעתנו זה עוד כשל מידע, והפעם גם המדינה לא יודעת. ומי שמהמר שם לא מקבל שום הגנה.", "מציג: איגור. זמן: 2 דקות. והעיתונות. לפי סקר TGI שפורסם ביולי 2026, החשיפה הממוצעת לעיתון יומי ירדה בשנה מ-37.7% ל-33.5%. ידיעות אחרונות ירד מ-17.6% ל-15.3%, ישראל היום מ-23.1% ל-22.0%. פחות קוראים זה פחות קהל למכור למפרסמים, בדיוק ההיגיון של פיקארד. וזה כבר מורגש: ביולי 2026 קבוצת הארץ פיטרה כ-35 עובדים, מהם כ-19 עיתונאים. ובאותו זמן יותר ישראלים נכנסים לבורסה. לפי הבורסה, ב-2025 נפתחו 200 אלף חשבונות מסחר חדשים, 25% יותר מ-2024. ובמחצית הראשונה של 2026 מחזור המסחר היומי במניות עלה ב-65%. כלומר יותר משקיעים פרטיים, הקבוצה שהמאמר אומר שהיא פגיעה, ופחות עיתונאים שיבדקו מה קורה להם. זה המעגל של איור 4, אצלנו. עד כאן מה המאמר טוען ואיך זה נראה בישראל. עכשיו איימן יבדוק עד כמה אפשר לסמוך על המאמר.", "מציג: איימן. זמן: דקה וחצי. במאמר: עמ' 63-65. נתחיל ממה שעובד. המאמר מסביר ארבעה תחומים שונים עם אותם מושגים שלמדנו בקורס. הרעיון החזק ביותר הוא החיבור בין הכשלים. בדרך כלל כל כשל מופיע בפרק נפרד, וכאן רואים איך אחד מחזק את השני. הדוגמאות אקטואליות ומוכרות לכולם, ולכל תחום יש הצעה מעשית ולא רק תיאור של הבעיה. אבל רעיון טוב צריך גם ראיות.", "מציג: איימן. זמן: 2 דקות. במאמר: איור 1 בעמ' 60, איור 2 בעמ' 61, איור 3 בעמ' 63, איור 5 בעמ' 64, מקור [2] בעמ' 66. וכאן הבעיה. לאיורים 1, 2, 3 ו-5 אין מקור נתונים ואין שיטה, כולל ה-15 דולר וה-12.99 שראינו קודם. לדעתנו אלה נתונים להמחשה בלבד. באיור 2 יש מדד של השפעת אסימטריה במידע: עובדי גיג 85%, משקיעים 75%. 85% ממה? לא מוסבר. אין במאמר שיטת מחקר. הוא מסתמך רק על ספרות קיימת. ומקור [2], ההרצאה של לואיס שכל פרק ההימורים נשען עליה, הוא קישור לפורטל של NYU שדורש התחברות. אי אפשר לבדוק מה לואיס באמת אמר. גם כתב העת חדש, כרך 1, ואין לנו מידע על תהליך השיפוט שלו.", "מציג: איימן. זמן: דקה וחצי. במאמר: עמ' 59, 61, 62, 65 ורשימת המקורות בעמ' 66. כשבדקנו את ההפניות מצאנו עוד בעיות. זוכרים את הכשל הרביעי? בתקציר מובטחים ארבעה כשלים, אבל על הרשתות החברתיות אין פרק. הן מופיעות רק בפתרונות ובסיכום. פול בארט מצוטט כמקור [2], אותו מספר של ההרצאה של לואיס, והוא בכלל לא ברשימת המקורות. הטענה על מסחר בתדירות גבוהה מפנה למקור על כלכלת הגיג, וחלוקת ההכנסות מפרסום מפנה למאמר על אלגוריתמים ברשתות. בעמ' 62 אותה פסקה מופיעה פעמיים, וה-DOI של מקור [5] שייך לכתב עת אחר. כל אחד מאלה קטן, אבל ביחד זה אומר שהמאמר לא עבר עריכה רצינית.", "מציג: איימן. זמן: דקה. ועוד דבר: המאמר מציג רק צד אחד. יש מחקרים חזקים שמראים את הצד השני, והוא לא מתייחס אליהם. צ'ן ושותפים מצאו שנהגי אובר מרוויחים מהגמישות יותר מפי שניים לעומת עבודה פחות גמישה. כהן ושותפים חישבו שאובר אקס יצר כ-2.9 מיליארד דולר עודף צרכן ב-2015, בארבע ערים בלבד. והנדרשוט ושותפים מצאו שמסחר אלגוריתמי צמצם את המרווח בין קנייה למכירה במניות הגדולות בניו יורק. אז המסקנה שלנו: רעיון חזק, ראיות חלשות. טוב כמסגרת חשיבה, לא כהוכחה. וזה מחזיר אותנו לשליח שלנו.", "מציגים: שנינו. זמן: 5 דקות. נניח שוולט מפרסמת מחר בדיוק איך האלגוריתם מחשב את התשלום. האם השליח מירושלים היה מרוויח יותר? (נותנים לקהל לענות. מה שרוצים לשמוע: האם שקיפות לבד מספיקה, או שבלי כוח מיקוח זה לא משנה.) אם הדיון נתקע, יש שלושה כיוונים על המסך. כיוון 1: מה עדיף, שקיפות, איגוד עובדים או הכרה בשליחים כעובדים? הפשרה של וולט בחרה דרך באמצע: כסף ושכר מינימום, בלי הכרה. כיוון 2: פיקארד מציע מימון ציבורי לעיתונות. מה קורה לעצמאות של עיתון שהמדינה מממנת? כיוון 3: המאמר אומר שרגולציה עצמית לא עובדת. מסכימים? אם אף אחד לא מעלה את זה: גם אם השליח מבין את האלגוריתם, אין לו לאן ללכת. זו בעיית מונופסון, לא רק בעיית מידע.", "מציגים: שנינו. זמן: 5 דקות. ועכשיו נבדוק כמה הקשבתם. מוציאים טלפונים, נכנסים ל-kahoot.it ומקלידים את הקוד. מי שעונה נכון ומהר מקבל יותר נקודות. (לפני ההצגה: לוודא שקוד המשחק בשקופית מעודכן.)", "משאירים על המסך כמה שניות. לא מקריאים.", "משאירים על המסך כמה שניות. לא מקריאים.", "מציגים: שנינו. זמן: דקה. נחזור לשאלה שפתחנו בה: למה המשלוח ממחנה יהודה לרמות ירד מ-40 ל-25 שקל? לפי המאמר זה לא מקרה בודד אלא כשל שוק: פער מידע, קונה אחד חזק, ועיתונות שכמעט לא בודקת. השוק לא יתקן את זה לבד. השאלה שנשארת פתוחה היא מי כן. מכריזים על המנצח בקאהוט. תודה רבה, ואם יש שאלות, נשמח לענות."], cur = 1;
var stage = document.getElementById('stage');
function fit() {
  var s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = 'scale(' + s + ') translate(-50%, -50%)';
}
function show(n) {
  n = Math.max(1, Math.min(N, n)); cur = n;
  stage.innerHTML = '';
  stage.appendChild(document.getElementById('t' + n).content.cloneNode(true)); // fresh copy restarts the animations
  document.getElementById('count').textContent = n + ' / ' + N;
  document.getElementById('notes').textContent = NOTES[n - 1] || '';
  history.replaceState(null, '', '#slide-' + n);
}
function next() { show(cur + 1); }
function prev() { show(cur - 1); }
addEventListener('keydown', function (e) {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].indexOf(e.key) >= 0) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].indexOf(e.key) >= 0) { e.preventDefault(); prev(); }
  else if (e.key === 'Home') show(1);
  else if (e.key === 'End') show(N);
  else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('show-notes');
  else if (e.key === 'f' || e.key === 'F') toggleFs();
});
function toggleFs() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  else document.exitFullscreen && document.exitFullscreen();
}
stage.addEventListener('click', function (e) { if (e.clientX > innerWidth / 2) next(); else prev(); });
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('nbtn').onclick = function () { document.body.classList.toggle('show-notes'); };
document.getElementById('fbtn').onclick = toggleFs;
addEventListener('resize', fit);
fit();
var h = /#slide-(\d+)/.exec(location.hash);
show(h ? +h[1] : 1);
